<!DOCTYPE html>
<html lang="en" data-ov="ui-sophisticated">
<head>

<style>
:root{
  --bg:#090B10;--panel:#121620;--line:#2A3040;--text:#F8FAFC;--mute:#94A3B8;--plate:#181D2A;--accent:#D4AF37;
  --deck1:#161B26;--deck2:#0C0F17;--deck-border:#C5A059;--plate-border:#384152;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark
}
@media(prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}}
:root[data-theme="dark"]{--bg:#07090E;--panel:#12141A;--line:#262A34;--text:#F1F5F9;--mute:#94A3B8;--plate:#4B505C;--deck1:#1A1C23;--deck2:#101216;--deck-border:#2D323E}
:root[data-theme="light"]{--bg:#E8EBF0;--panel:#F8FAFC;--line:#CBD5E1;--text:#0F172A;--mute:#475569;--plate:#8B93A3;--deck1:#CBD5E1;--deck2:#94A3B8;--deck-border:#64748B;color-scheme:light}
:root[data-theme="matrix"]{--bg:#010902;--panel:#031606;--line:#00FF41;--text:#00FF41;--mute:#15803D;--plate:#042409;--accent:#00FF41;--deck1:#031A07;--deck2:#010802;--deck-border:#00FF41}
:root[data-theme="midnight"]{--bg:#020617;--panel:#0F172A;--line:#1E293B;--text:#E2E8F0;--mute:#64748B;--plate:#1E293B;--deck1:#0F172A;--deck2:#020617;--deck-border:#334155}
:root[data-theme="cyberpunk"]{--bg:#0D0221;--panel:#19053B;--line:#4C1D95;--text:#F0ABFC;--mute:#C084FC;--plate:#2E1065;--deck1:#240046;--deck2:#10002B;--deck-border:#7E22CE}
:root[data-theme="emerald"]{--bg:#021612;--panel:#062821;--line:#0F4C3E;--text:#D1FAE5;--mute:#6EE7B7;--plate:#114237;--deck1:#06342B;--deck2:#021B16;--deck-border:#059669}
:root[data-theme="crimson"]{--bg:#160408;--panel:#280911;--line:#501322;--text:#FFE4E6;--mute:#FDA4AF;--plate:#3F101C;--deck1:#310B15;--deck2:#190409;--deck-border:#BE123C}
:root[data-theme="nord"]{--bg:#2E3440;--panel:#3B4252;--line:#4C566A;--text:#ECEFF4;--mute:#D8DEE9;--plate:#434C5E;--deck1:#3B4252;--deck2:#2E3440;--deck-border:#4C566A}
:root[data-theme="solarlight"]{--bg:#FDF6E3;--panel:#EEE8D5;--line:#D3CBB7;--text:#073642;--mute:#586E75;--plate:#93A1A1;--deck1:#E1DBCA;--deck2:#D3CBB7;--deck-border:#93A1A1;color-scheme:light}
:root[data-theme="solardark"]{--bg:#002B36;--panel:#073642;--line:#2AA198;--text:#93A1A1;--mute:#657B83;--plate:#0A4452;--deck1:#073642;--deck2:#00212B;--deck-border:#586E75}
:root[data-theme="mocha"]{--bg:#1E1E2E;--panel:#181825;--line:#313244;--text:#CDD6F4;--mute:#A6ADC8;--plate:#45475A;--deck1:#26273B;--deck2:#11111B;--deck-border:#585B70}
:root[data-theme="contrast"]{--bg:#000000;--panel:#0A0A0A;--line:#FFFFFF;--text:#FFFFFF;--mute:#E2E8F0;--plate:#1F1F1F;--deck1:#0A0A0A;--deck2:#000000;--deck-border:#FFFFFF}

/* Core Overlays (Sophisticated ForefrontHawk Default, Tech, Futuristic, Classic & 20 Hardware/OS Skins) */
[data-ov="ui-sophisticated"]{--bg:#090B10;--panel:#121620;--line:#2A3040;--text:#F8FAFC;--mute:#94A3B8;--plate:#181D2A;--accent:#D4AF37;--deck1:#161B26;--deck2:#0C0F17;--deck-border:#C5A059}
[data-ov="ui-sophisticated"] .bar{background:linear-gradient(180deg,rgba(22,27,38,0.96),rgba(14,17,24,0.98))!important;border:1px solid rgba(212,175,55,0.35)!important}
[data-ov="ui-sophisticated"] .deck{border:2px solid #C5A059!important;box-shadow:0 18px 45px rgba(0,0,0,0.85)!important}
[data-ov="ui-tech"]{--bg:#040B14;--panel:#071524;--line:#0EA5E9;--text:#E0F2FE;--mute:#38BDF8;--plate:#081C30;--accent:#00F5D4;--deck1:#07192B;--deck2:#030C16;--deck-border:#0EA5E9;--font:"JetBrains Mono",monospace}
[data-ov="ui-tech"] .bar,[data-ov="ui-tech"] .deck{border-radius:3px!important;border-color:#0EA5E9!important}
[data-ov="ui-futuristic"]{--bg:#060414;--panel:#110B29;--line:#8B5CF6;--text:#F3E8FF;--mute:#C4B5FD;--plate:#170F36;--accent:#00F0FF;--deck1:#19103B;--deck2:#09051A;--deck-border:#00F0FF}
[data-ov="ui-futuristic"] .bar,[data-ov="ui-futuristic"] .deck{border-radius:18px!important;border-color:#00F0FF!important;box-shadow:0 0 24px rgba(139,92,246,0.3)!important}
[data-ov="os-win95"] .bar,[data-ov="os-win95"] .deck{background:#C0C0C0!important;color:#000!important;border:2px outset #FFF!important;border-radius:0!important}
[data-ov="os-winxp"] .bar,[data-ov="os-winxp"] .deck{background:linear-gradient(180deg,#245EDB,#1941A5)!important;color:#FFF!important;border:2px solid #003399!important}
[data-ov="os-pipboy"] .bar,[data-ov="os-pipboy"] .deck{background:#051405!important;color:#1AFF40!important;border:2px solid #1AFF40!important}
[data-ov="app-winamp"] .bar,[data-ov="app-winamp"] .deck{background:#292938!important;color:#00FF00!important;border:2px ridge #6E738B!important;border-radius:0!important}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:500 13px/1.4 var(--font);min-height:100vh;overflow-x:hidden;transition:background-color .18s,color .18s}
.wrap{max-width:1240px;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:7px 10px}
button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;min-height:32px;cursor:pointer}
button:hover{filter:brightness(1.14)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);min-height:auto}
input[type=color]{padding:1px;width:36px;height:30px;min-height:30px}
.brand{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:6px}.brand i{font-style:normal;color:var(--accent)}
.chip{font:600 11px var(--mono);padding:3px 8px;border-radius:7px;border:1px solid var(--line);color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;min-height:26px;padding:2px 8px;background:none;color:var(--mute);font-weight:700;font-size:11.5px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121C}
.deck{display:flex;flex-direction:column;gap:10px;background:linear-gradient(145deg,var(--deck1),var(--deck2));border:2px solid var(--deck-border);border-radius:18px;padding:12px}
.subcard{background:rgba(0,0,0,0.2);border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.subhead{font:800 10.5px var(--mono);text-transform:uppercase;color:var(--accent);letter-spacing:0.5px;margin-right:4px}
.swatch-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:8px;border:2px solid #fff;font:800 12px var(--mono);box-shadow:0 0 12px var(--active-c,#10B981)}
</style>

<style>
.peg-board {
  display:grid;
  grid-template-columns:repeat(var(--pcols, 32), minmax(0, 1fr));
  gap:var(--pgap, 3px);
  background:#04060A;
  padding:14px;
  border-radius:14px;
  border:2px solid var(--deck-border);
  box-shadow:inset 0 0 30px #000;
  touch-action:none;
  max-width:960px;
  margin:0 auto;
  width:100%;
}
.peg {
  aspect-ratio:1/1;
  border-radius:var(--prad, 50%);
  background:#111520;
  border:1px solid rgba(255,255,255,0.07);
  cursor:crosshair;
  transition:transform 0.06s;
}
.peg.lit {
  background:radial-gradient(circle at 35% 35%, #FFFFFF 0%, var(--pc) 45%, var(--pc) 100%);
  box-shadow:0 0 var(--pglow, 10px) var(--pc), 0 0 4px #FFF;
  border-color:#FFF;
  transform:scale(1.06);
}
</style>
</head>
<body>
<div class="wrap">

  <!-- SHARED FOREFRONTHAWK.COM ECOSYSTEM HEADER & CUSTOMIZER -->
  <header class="bar">
    <span class="brand">🦅 Forefront<i>Hawk</i> <span class="chip">HawkDraw Light-Rite</span></span>
    <nav class="seg" id="suiteNavSeg" aria-label="ForefrontHawk Suite Navigation">
      <button type="button" data-page="HawkChroma" aria-pressed="false">🎹 HawkChroma</button>
      <button type="button" data-page="HawkDraw" aria-pressed="true">💡 HawkDraw</button>
      <button type="button" data-page="HawkShine" aria-pressed="false">⚡ HawkShine</button>
      <button type="button" data-page="HawkRGB" aria-pressed="false">🎞️ HawkRGB</button>
    </nav>
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
      <span class="chip" title="Live Color Synced from HawkChroma Tab">Chroma Link:</span>
      <span id="chromaLiveSwatch" class="swatch-pill" style="background:#10B981;color:#080B10">#10B981 (GRN)</span>
      <button id="toggleSharedCustBtn" type="button">🛠️ UI &amp; Skin</button>
    </div>
  </header>

  <section id="sharedCustPanel" class="bar" hidden>
    <div class="subcard">
      <span class="subhead">Shared forefronthawk.com UI (Travels Across All Sites)</span>
      <label>🎛️ Overlay <select id="sharedOverlaySel"></select></label>
      <label>UI Theme
        <select id="sharedThemeSel">
          <option value="dark">Obsidian Dark</option>
          <option value="light">Studio Daylight</option>
          <option value="matrix">Matrix Digital Code</option>
          <option value="midnight">Midnight OLED</option>
          <option value="cyberpunk">Cyberpunk Neon</option>
          <option value="emerald">Emerald Matrix</option>
          <option value="crimson">Crimson Forged</option>
          <option value="nord">Nordic Frost</option>
          <option value="solarlight">Solarized Light</option>
          <option value="solardark">Solarized Dark</option>
          <option value="mocha">Catppuccin Mocha</option>
          <option value="contrast">High-Contrast Pro</option>

        </select>
      </label>
      <label>Font
        <select id="sharedFontSel">
          <option value="system">System Sans</option>
          <option value="calibri">Calibri</option>
          <option value="arial">Arial</option>
          <option value="inter">Inter Studio</option>
          <option value="serif">Serif</option>
          <option value="mono">JetBrains Mono</option>

        </select>

      <label>BG <input type="color" id="cBgIn" value="#090B10"></label>
      <label>Panel <input type="color" id="cPanelIn" value="#121620"></label>
      <label>Text <input type="color" id="cTextIn" value="#F8FAFC"></label>
    </div>
  </section>


  <section class="bar">
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%">
      <div class="seg" id="drawToolSeg">
        <button data-t="pen" aria-pressed="true">💡 Light Peg</button>
        <button data-t="line" aria-pressed="false">📏 Line</button>
        <button data-t="fill" aria-pressed="false">🪣 Flood Fill</button>
        <button data-t="erase" aria-pressed="false">🧹 Unplug Peg</button>
      </div>
      <label>Grid
        <select id="pegGridSel">
          <option value="20x12">20×12 (2×10 Ratio)</option>
          <option value="32x20" selected>32×20 (Classic Light-Rite)</option>
          <option value="48x28">48×28 (HD Pegboard)</option>
        </select>
      </label>
      <label>Peg Shape
        <select id="pegShapeSel">
          <option value="50%">Round LED Bulb</option>
          <option value="22%">Square Crystal Peg</option>
          <option value="2px">Retro Pixel Block</option>
        </select>
      </label>
      <label>Mirror
        <select id="pegSymSel">
          <option value="off">Off</option>
          <option value="h">Horizontal Mirror</option>
          <option value="v">Vertical Mirror</option>
          <option value="quad">4-Way Kaleidoscope</option>
        </select>
      </label>
      <button id="pegPulseBtn">✨ Glow Pulse: Off</button>
      <button id="pegSampleHawkBtn" style="border-color:var(--accent);color:var(--accent)">🦅 Load Hawk Crest</button>
      <button id="pegExportPngBtn" style="background:#059669;color:#fff">📸 Export PNG</button>
      <button id="pegClearBtn" style="color:#FCA5A5;border-color:#EF4444;margin-left:auto">Clear Board</button>
    </div>
  </section>

  <main class="deck">
    <div id="pegBoard" class="peg-board"></div>
  </main>
</div>

<script>

var FONTS={
  system:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  calibri:'Calibri,"Segoe UI",Candara,sans-serif',
  arial:'Arial,"Helvetica Neue",Helvetica,sans-serif',
  inter:'"Inter",system-ui,sans-serif',
  serif:'Georgia,"Times New Roman",Times,serif',
  mono:'"JetBrains Mono",Consolas,ui-monospace,monospace',
  space:'"Space Grotesk",system-ui,sans-serif',
  orbitron:'"Orbitron",system-ui,sans-serif',
  pixel:'"Press Start 2P",ui-monospace,monospace'
};
var ACC={sky:"#38BDF8",gold:"#D4AF37",green:"#34D399",amber:"#FBBF24",rose:"#FB7185",violet:"#A78BFA"};
var OVERLAY_LIST=[
  ["ui-sophisticated","★ Sophisticated (ForefrontHawk)"],
  ["ui-tech","★ Tech (CAD Telemetry)"],
  ["ui-futuristic","★ Futuristic (Holo-Glass)"],
  ["none","0. Classic UI"],["mech-ibm","1. IBM Model M"],["mech-c64","2. Commodore 64"],
  ["mech-cyber","3. Cyber Neon"],["mech-typewriter","4. Typewriter"],["mech-arcade","5. Arcade Sanwa"],
  ["plug-vst","6. VST Rack"],["plug-eurorack","7. Eurorack"],["plug-mpc","8. Akai MPC"],
  ["plug-dmx","9. GrandMA DMX"],["plug-davinci","10. DaVinci Panel"],["app-winamp","11. Winamp 2.x"],
  ["app-ps3","12. Photoshop 3"],["app-lotus","13. Lotus 1-2-3"],["app-soundforge","14. FastTracker"],
  ["app-hypercard","15. HyperCard"],["os-win95","16. Windows 95"],["os-winxp","17. Windows XP"],
  ["os-mac9","18. Mac OS 9"],["os-amiga","19. AmigaOS 1.3"],["os-pipboy","20. CRT Pip-Boy"]
];

var UI_STATE={
  mode:"dark",overlay:"ui-sophisticated",font:"system",accent:"gold",
  cBg:"#090B10",cPanel:"#121620",cText:"#F8FAFC",cPlate:"#181D2A",
  activeColor:"#10B981",activeLabel:"GRN"
};

var suiteChan=null,chromaChan=null;
try{
  if(typeof BroadcastChannel!=="undefined"){
    suiteChan=new BroadcastChannel("forefronthawk_suite_bus");
    chromaChan=new BroadcastChannel("hawkchroma_2x10_bus");
  }
}catch(e){}

function loadSharedUi(){
  try{
    var sv=JSON.parse(localStorage.getItem("forefronthawk_shared_ui")||localStorage.getItem("hawkchroma_v4")||"null");
    if(sv){
      if(sv.mode)UI_STATE.mode=sv.mode;
      if(sv.overlay)UI_STATE.overlay=sv.overlay;
      if(sv.font)UI_STATE.font=sv.font;
      if(sv.accent)UI_STATE.accent=sv.accent;
      if(sv.cBg)UI_STATE.cBg=sv.cBg;
      if(sv.cPanel)UI_STATE.cPanel=sv.cPanel;
      if(sv.cText)UI_STATE.cText=sv.cText;
      if(sv.cPlate)UI_STATE.cPlate=sv.cPlate;
      if(sv.activeColor||sv.shown||sv.hex)UI_STATE.activeColor=sv.activeColor||sv.shown||sv.hex;
    }
  }catch(e){}
  applySharedUiToDom();
}

function saveAndBroadcastUi(broadcast){
  try{
    localStorage.setItem("forefronthawk_shared_ui",JSON.stringify(UI_STATE));
    // Also update hawkchroma_v4 so HawkChroma inherits changes immediately
    var hc=JSON.parse(localStorage.getItem("hawkchroma_v4")||"{}");
    hc.mode=UI_STATE.mode;hc.overlay=UI_STATE.overlay;hc.font=UI_STATE.font;
    hc.cBg=UI_STATE.cBg;hc.cPanel=UI_STATE.cPanel;hc.cText=UI_STATE.cText;hc.cPlate=UI_STATE.cPlate;
    hc.shown=UI_STATE.activeColor;hc.hex=UI_STATE.activeColor;
    localStorage.setItem("hawkchroma_v4",JSON.stringify(hc));
  }catch(e){}
  applySharedUiToDom();
  if(broadcast&&suiteChan){
    try{suiteChan.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE})}catch(e){}
  }
}

function applySharedUiToDom(){
  var r=document.documentElement;
  r.setAttribute("data-theme",UI_STATE.mode||"dark");
  if(UI_STATE.overlay&&UI_STATE.overlay!=="none")r.setAttribute("data-ov",UI_STATE.overlay);
  else r.removeAttribute("data-ov");
  r.style.setProperty("--font",FONTS[UI_STATE.font]||FONTS.system);
  r.style.setProperty("--accent",ACC[UI_STATE.accent]||"#D4AF37");
  if(UI_STATE.mode==="custom_live"){
    r.style.setProperty("--bg",UI_STATE.cBg);
    r.style.setProperty("--panel",UI_STATE.cPanel);
    r.style.setProperty("--text",UI_STATE.cText);
    r.style.setProperty("--plate",UI_STATE.cPlate);
  }else{
    r.style.removeProperty("--bg");r.style.removeProperty("--panel");
    r.style.removeProperty("--text");r.style.removeProperty("--plate");
  }
  r.style.setProperty("--active-c",UI_STATE.activeColor);
  var sw=document.getElementById("chromaLiveSwatch");
  if(sw){
    sw.style.background=UI_STATE.activeColor;
    sw.textContent=UI_STATE.activeColor+" ("+UI_STATE.activeLabel+")";
  }
  if(document.getElementById("sharedOverlaySel"))document.getElementById("sharedOverlaySel").value=UI_STATE.overlay;
  if(document.getElementById("sharedThemeSel"))document.getElementById("sharedThemeSel").value=UI_STATE.mode;
  if(document.getElementById("sharedFontSel"))document.getElementById("sharedFontSel").value=UI_STATE.font;
  if(typeof onChromaColorReceived==="function")onChromaColorReceived(UI_STATE.activeColor,UI_STATE.activeLabel);
}

function initSharedCustomizerBar(){
  document.querySelectorAll("#suiteNavSeg button").forEach(function(b){b.onclick=function(){location.assign(b.dataset.page+".html")}});
  var ovSel=document.getElementById("sharedOverlaySel");
  if(ovSel&&!ovSel.options.length){
    OVERLAY_LIST.forEach(function(o){
      var op=document.createElement("option");op.value=o[0];op.textContent=o[1];ovSel.appendChild(op);
    });
    ovSel.onchange=function(){UI_STATE.overlay=this.value;saveAndBroadcastUi(true)};
  }
  var thSel=document.getElementById("sharedThemeSel");
  if(thSel){thSel.onchange=function(){UI_STATE.mode=this.value;saveAndBroadcastUi(true)}}
  var fnSel=document.getElementById("sharedFontSel");
  if(fnSel){fnSel.onchange=function(){UI_STATE.font=this.value;saveAndBroadcastUi(true)}}
  var custBtn=document.getElementById("toggleSharedCustBtn");
  if(custBtn){
    custBtn.onclick=function(){
      var p=document.getElementById("sharedCustPanel");
      if(p)p.hidden=!p.hidden;
    };
  }
  ["cBgIn","cPanelIn","cTextIn"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.oninput=function(){
      UI_STATE.cBg=document.getElementById("cBgIn").value;
      UI_STATE.cPanel=document.getElementById("cPanelIn").value;
      UI_STATE.cText=document.getElementById("cTextIn").value;
      UI_STATE.mode="custom_live";
      saveAndBroadcastUi(true);
    };
  });
}

// Listen for cross-tab / cross-window updates from HawkChroma or any forefronthawk.com app
window.addEventListener("storage",function(e){
  if(e.key==="forefronthawk_shared_ui"||e.key==="hawkchroma_v4")loadSharedUi();
});
if(suiteChan){
  suiteChan.onmessage=function(e){
    if(e.data&&e.data.ui){
      Object.assign(UI_STATE,e.data.ui);
      applySharedUiToDom();
    }
  };
}
if(chromaChan){
  chromaChan.onmessage=function(e){
    if(e.data&&e.data.hex){
      UI_STATE.activeColor=e.data.hex.toUpperCase();
      UI_STATE.activeLabel=e.data.label||"CHROMA";
      saveAndBroadcastUi(false);
    }
  };
}

(function(){
  var cols=32,rows=20,tool="pen",sym="off",pulsing=false,pulseRaf=0,pegs=[],down=false,lineStart=null;
  var board=document.getElementById("pegBoard");

  function buildBoard(){
    board.innerHTML="";pegs=[];
    board.style.setProperty("--pcols",cols);
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var d=document.createElement("div");
        d.className="peg";
        d.dataset.r=r;d.dataset.c=c;d.dataset.color="";
        board.appendChild(d);
        pegs.push(d);
      }
    }
  }

  function setPeg(r,c,hex){
    if(r<0||r>=rows||c<0||c>=cols)return;
    var p=pegs[r*cols+c];if(!p)return;
    if(hex){
      p.classList.add("lit");
      p.style.setProperty("--pc",hex);
      p.dataset.color=hex;
    }else{
      p.classList.remove("lit");
      p.style.removeProperty("--pc");
      p.dataset.color="";
    }
  }

  function plotWithSym(r,c,hex){
    setPeg(r,c,hex);
    if(sym==="h"||sym==="quad")setPeg(r,cols-1-c,hex);
    if(sym==="v"||sym==="quad")setPeg(rows-1-r,c,hex);
    if(sym==="quad")setPeg(rows-1-r,cols-1-c,hex);
  }

  function floodFill(sr,sc,newHex){
    var target=pegs[sr*cols+sc].dataset.color||"";
    if(target===newHex)return;
    var q=[[sr,sc]],vis={};
    while(q.length){
      var cur=q.shift(),r=cur[0],c=cur[1],k=r+","+c;
      if(vis[k]||r<0||r>=rows||c<0||c>=cols)continue;
      var p=pegs[r*cols+c];
      if((p.dataset.color||"")!==target)continue;
      vis[k]=true;
      setPeg(r,c,newHex);
      q.push([r+1,c],[r-1,c],[r,c+1],[r,c-1]);
    }
  }

  function drawLine(r0,c0,r1,c1,hex){
    var steps=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));
    for(var i=0;i<=steps;i++){
      var r=Math.round(r0+(r1-r0)*(steps?i/steps:0));
      var c=Math.round(c0+(c1-c0)*(steps?i/steps:0));
      plotWithSym(r,c,hex);
    }
  }

  function handlePointer(e,isDown){
    var el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el||!el.classList.contains("peg"))return;
    var r=+el.dataset.r,c=+el.dataset.c,hex=UI_STATE.activeColor||"#10B981";
    if(tool==="erase")plotWithSym(r,c,"");
    else if(tool==="fill"&&isDown)floodFill(r,c,hex);
    else if(tool==="line"){
      if(isDown)lineStart=[r,c];
      else if(lineStart){drawLine(lineStart[0],lineStart[1],r,c,hex);lineStart=null}
    }else plotWithSym(r,c,hex);
  }

  board.addEventListener("pointerdown",function(e){down=true;handlePointer(e,true)});
  board.addEventListener("pointermove",function(e){if(down&&tool!=="line"&&tool!=="fill")handlePointer(e,false)});
  window.addEventListener("pointerup",function(e){if(down&&tool==="line")handlePointer(e,false);down=false});

  document.querySelectorAll("#drawToolSeg button").forEach(function(b){
    b.onclick=function(){
      tool=b.dataset.t;
      document.querySelectorAll("#drawToolSeg button").forEach(function(x){x.setAttribute("aria-pressed",x===b)});
    };
  });
  document.getElementById("pegGridSel").onchange=function(){
    var pts=this.value.split("x");cols=+pts[0];rows=+pts[1];buildBoard();
  };
  document.getElementById("pegShapeSel").onchange=function(){
    board.style.setProperty("--prad",this.value);
  };
  document.getElementById("pegSymSel").onchange=function(){sym=this.value};
  document.getElementById("pegClearBtn").onclick=buildBoard;

  function loadHawkSample(){
    buildBoard();
    var midC=Math.floor(cols/2),midR=Math.floor(rows/2);
    for(var w=0;w<Math.min(12,midC-1);w++){
      plotWithSym(midR-Math.floor(w/2),midC+w,"#D4AF37");
      plotWithSym(midR-Math.floor(w/2)+1,midC+w,"#38BDF8");
      plotWithSym(midR+Math.floor(w/3),midC+Math.floor(w/2),"#10B981");
    }
    plotWithSym(midR-2,midC,"#EF4444");
  }
  document.getElementById("pegSampleHawkBtn").onclick=loadHawkSample;

  var pTick=0;
  function pulseLoop(){
    if(!pulsing)return;
    pTick=(pTick+4)%360;
    var g=6+Math.round((Math.sin(pTick*Math.PI/180)+1)*8);
    board.style.setProperty("--pglow",g+"px");
    pulseRaf=requestAnimationFrame(pulseLoop);
  }
  document.getElementById("pegPulseBtn").onclick=function(){
    pulsing=!pulsing;
    this.textContent=pulsing?"✨ Glow Pulse: ON":"✨ Glow Pulse: Off";
    if(pulsing)pulseRaf=requestAnimationFrame(pulseLoop);
    else cancelAnimationFrame(pulseRaf);
  };

  document.getElementById("pegExportPngBtn").onclick=function(){
    var cv=document.createElement("canvas");
    cv.width=cols*24;cv.height=rows*24;
    var ctx=cv.getContext("2d");
    ctx.fillStyle="#04060A";ctx.fillRect(0,0,cv.width,cv.height);
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var col=pegs[r*cols+c].dataset.color;
        ctx.beginPath();
        ctx.arc(c*24+12,r*24+12,col?9:4,0,Math.PI*2);
        ctx.fillStyle=col||"#161B26";
        if(col){ctx.shadowColor=col;ctx.shadowBlur=12}else ctx.shadowBlur=0;
        ctx.fill();
      }
    }
    var a=document.createElement("a");
    a.href=cv.toDataURL("image/png");
    a.download="hawkdraw_light_rite.png";
    a.click();
  };

  initSharedCustomizerBar();
  loadSharedUi();
  loadHawkSample();
})();
</script>
</body>
</html>
