<style>
/* Fit-to-Window & Full Screen Paint Workspace Layout (Zero Page Scroll, Room for Toolbars) */
html, body {
  height:100vh;
  height:100dvh;
  overflow:hidden;
}
.wrap {
  max-width:100%;
  height:100vh;
  height:100dvh;
  padding:6px 8px;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
}
body.fs-paint #topSuiteHeader,
body.fs-paint #sharedCustPanel,
body.fs-paint #gradStudioBar.collapsed {
  display:none!important;
}
body.fs-paint .wrap {
  padding:4px;
  gap:4px;
}

/* Workspace Flex Container (Supports Top, Bottom, Left, Right Tablet Dock Positions!) */
.paint-workspace {
  flex:1 1 0;
  min-height:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  overflow:hidden;
}
.paint-workspace[data-dock="bottom"] { flex-direction:column-reverse; }
.paint-workspace[data-dock="left"] { flex-direction:row; }
.paint-workspace[data-dock="right"] { flex-direction:row-reverse; }

/* Primary Paint Toolbar (Adapts to Horizontal Ribbon or Vertical Tablet Side Dock) */
.paint-toolbar {
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:5px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:6px 8px;
  flex-shrink:0;
  z-index:20;
}
.paint-workspace[data-dock="left"] .paint-toolbar,
.paint-workspace[data-dock="right"] .paint-toolbar {
  width:230px;
  flex-direction:column;
  align-items:stretch;
  overflow-y:auto;
  max-height:100%;
}
.paint-workspace[data-dock="left"] .paint-toolbar .seg,
.paint-workspace[data-dock="right"] .paint-toolbar .seg {
  display:grid;
  grid-template-columns:repeat(2,1fr);
}

.tool-btn {
  padding:4px 8px;
  min-height:30px;
  font-size:12px;
  font-weight:700;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  gap:4px;
  white-space:nowrap;
}
.tool-btn[aria-pressed="true"] {
  background:var(--accent)!important;
  color:#04121C!important;
  border-color:#FFF!important;
}

/* Canvas Stage Area (Automatically centers and scales to fit remaining viewport space) */
.stage-wrap {
  flex:1 1 0;
  min-height:0;
  min-width:0;
  background:linear-gradient(145deg, var(--deck1), var(--deck2));
  border:2px solid var(--deck-border);
  border-radius:14px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:6px;
  box-shadow:inset 0 0 24px rgba(0,0,0,0.75);
}
#paintCanvas {
  background:#FFFFFF;
  border-radius:6px;
  box-shadow:0 8px 30px rgba(0,0,0,0.75);
  cursor:crosshair;
  touch-action:none;
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

/* Light-Rite Mode Pegboard inside Stage */
.peg-board {
  display:grid;
  grid-template-columns:repeat(var(--pcols, 32), minmax(0, 1fr));
  gap:3px;
  background:#04060A;
  padding:10px;
  border-radius:10px;
  border:2px solid var(--deck-border);
  box-shadow:inset 0 0 28px #000;
  touch-action:none;
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  align-content:center;
}
.peg {
  aspect-ratio:1/1;
  border-radius:var(--prad, 50%);
  background:#111520;
  border:1px solid rgba(255,255,255,0.09);
  cursor:pointer;
}
.peg.lit {
  background:radial-gradient(circle at 35% 35%, #FFFFFF 0%, var(--pc) 48%, var(--pc) 100%);
  box-shadow:0 0 9px var(--pc), 0 0 3px #FFF;
  border-color:#FFF;
}

/* Gradient Studio Bar */
.grad-preview {
  width:110px;
  height:26px;
  border-radius:6px;
  border:2px solid #FFF;
  cursor:pointer;
  flex-shrink:0;
}
.grad-preset-chip {
  width:28px;
  height:24px;
  border-radius:6px;
  border:1.5px solid rgba(255,255,255,0.65);
  cursor:pointer;
  padding:0;
  min-height:0;
  flex-shrink:0;

<script>

var FONTS={
  system:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
  calibri:'Calibri,"Segoe UI",Candara,sans-serif',
  arial:'Arial,"Helvetica Neue",Helvetica,sans-serif',
  inter:'"Inter",system-ui,sans-serif',
  serif:'Georgia,"Times New Roman",Times,serif',
  mono:'"JetBrains Mono",Consolas,ui-monospace,monospace',
  space:'"Space Grotesk",system-ui,sans-serif',
  orbitron:'"Orbitron",system-ui,sans-serif',
  pixel:'"Press Start 2P",ui-monospace,monospace'
};
var ACC={sky:"#38BDF8",gold:"#D4AF37",green:"#34D399",amber:"#FBBF24",rose:"#FB7185",violet:"#A78BFA"};
var OVERLAY_LIST=[
  ["ui-sophisticated","★ Sophisticated (ForefrontHawk)"],
  ["ui-tech","★ Tech (CAD Telemetry)"],
  ["ui-futuristic","★ Futuristic (Holo-Glass)"],
  ["none","0. Classic UI"],["mech-ibm","1. IBM Model M"],["mech-c64","2. Commodore 64"],
  ["mech-cyber","3. Cyber Neon"],["mech-typewriter","4. Typewriter"],["mech-arcade","5. Arcade Sanwa"],
  ["plug-vst","6. VST Rack"],["plug-eurorack","7. Eurorack"],["plug-mpc","8. Akai MPC"],
  ["plug-dmx","9. GrandMA DMX"],["plug-davinci","10. DaVinci Panel"],["app-winamp","11. Winamp 2.x"],
  ["app-ps3","12. Photoshop 3"],["app-lotus","13. Lotus 1-2-3"],["app-soundforge","14. FastTracker"],
  ["app-hypercard","15. HyperCard"],["os-win95","16. Windows 95"],["os-winxp","17. Windows XP"],
  ["os-mac9","18. Mac OS 9"],["os-amiga","19. AmigaOS 1.3"],["os-pipboy","20. CRT Pip-Boy"]
];

var UI_STATE={
  mode:"dark",overlay:"ui-sophisticated",font:"system",accent:"gold",
  cBg:"#090B10",cPanel:"#121620",cText:"#F8FAFC",cPlate:"#181D2A",
  activeColor:"#10B981",activeLabel:"GRN"
};

var suiteChan=null,chromaChan=null;
try{
  if(typeof BroadcastChannel!=="undefined"){
    suiteChan=new BroadcastChannel("forefronthawk_suite_bus");
    chromaChan=new BroadcastChannel("hawkchroma_2x10_bus");
  }
}catch(e){}

var chromaPopupWin=null;

function readRootDomainCookie(){
  try{
    var m=document.cookie.match(/(?:^|;\s*)ffh_ui=([^;]+)/);
    if(m&&m[1])return JSON.parse(decodeURIComponent(m[1]));
  }catch(e){}
  return null;
}

function writeRootDomainCookie(obj){
  try{
    var val=encodeURIComponent(JSON.stringify(obj));
    // Set onboth .forefronthawk.com (travels across chroma, draw, shine, rgb subdomains!) and current host
    document.cookie="ffh_ui="+val+"; domain=.forefronthawk.com; path=/; max-age=31536000; SameSite=Lax";
    document.cookie="ffh_ui="+val+"; path=/; max-age=31536000; SameSite=Lax";
  }catch(e){}
}

function readUrlHashState(){
  try{
    if(location.hash&&location.hash.indexOf("ffh=")>-1){
      var part=location.hash.split("ffh=")[1].split("&")[0];
      return JSON.parse(decodeURIComponent(part));
    }
  }catch(e){}
  return null;
}

function updateSubdomainBannerLinks(){
  try{
    writeRootDomainCookie(UI_STATE);
    document.querySelectorAll("a.sub-link").forEach(function(a){
      var base=a.dataset.sub||a.getAttribute("href").split("#")[0];
      a.href=base;
      a.onclick=function(){writeRootDomainCookie(UI_STATE)};
    });
  }catch(e){}
}

function loadSharedUi(){
  try{
    var fromHash=readUrlHashState();
    var fromCookie=readRootDomainCookie();
    var fromLs=JSON.parse(localStorage.getItem("forefronthawk_shared_ui")||localStorage.getItem("hawkchroma_v4")||"null");
    var sv=fromHash||fromCookie||fromLs;
    if(sv){
      if(sv.mode)UI_STATE.mode=sv.mode;
      if(sv.overlay)UI_STATE.overlay=sv.overlay;
      if(sv.font)UI_STATE.font=sv.font;
      if(sv.accent)UI_STATE.accent=sv.accent;
      if(sv.cBg)UI_STATE.cBg=sv.cBg;
      if(sv.cPanel)UI_STATE.cPanel=sv.cPanel;
      if(sv.cText)UI_STATE.cText=sv.cText;
      if(sv.cPlate)UI_STATE.cPlate=sv.cPlate;
      if(sv.activeColor||sv.shown||sv.hex)UI_STATE.activeColor=sv.activeColor||sv.shown||sv.hex;
      if(fromHash)writeRootDomainCookie(UI_STATE);
    }
  }catch(e){}
  applySharedUiToDom();
  updateSubdomainBannerLinks();
}

function saveAndBroadcastUi(broadcast){
  try{
    localStorage.setItem("forefronthawk_shared_ui",JSON.stringify(UI_STATE));
    writeRootDomainCookie(UI_STATE);
    updateSubdomainBannerLinks();
    var hc=JSON.parse(localStorage.getItem("hawkchroma_v4")||"{}");
    hc.mode=UI_STATE.mode;hc.overlay=UI_STATE.overlay;hc.font=UI_STATE.font;
    hc.cBg=UI_STATE.cBg;hc.cPanel=UI_STATE.cPanel;hc.cText=UI_STATE.cText;hc.cPlate=UI_STATE.cPlate;
    hc.shown=UI_STATE.activeColor;hc.hex=UI_STATE.activeColor;
    localStorage.setItem("hawkchroma_v4",JSON.stringify(hc));
  }catch(e){}
  applySharedUiToDom();
  if(broadcast){
    if(suiteChan){try{suiteChan.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE})}catch(e){}}
    if(window.opener){try{window.opener.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE},"*")}catch(e){}}
    if(chromaPopupWin&&!chromaPopupWin.closed){try{chromaPopupWin.postMessage({type:"FFH_UI_SYNC",ui:UI_STATE},"*")}catch(e){}}
  }
}

function applySharedUiToDom(){
  var r=document.documentElement;
  r.setAttribute("data-theme",UI_STATE.mode||"dark");
  if(UI_STATE.overlay&&UI_STATE.overlay!=="none")r.setAttribute("data-ov",UI_STATE.overlay);
  else r.removeAttribute("data-ov");
  r.style.setProperty("--font",FONTS[UI_STATE.font]||FONTS.system);
  r.style.setProperty("--accent",ACC[UI_STATE.accent]||"#D4AF37");
  if(UI_STATE.mode==="custom_live"){
    r.style.setProperty("--bg",UI_STATE.cBg);
    r.style.setProperty("--panel",UI_STATE.cPanel);
    r.style.setProperty("--text",UI_STATE.cText);
    r.style.setProperty("--plate",UI_STATE.cPlate);
  }else{
    r.style.removeProperty("--bg");r.style.removeProperty("--panel");
    r.style.removeProperty("--text");r.style.removeProperty("--plate");
  }
  r.style.setProperty("--active-c",UI_STATE.activeColor);
  var sw=document.getElementById("chromaLiveSwatch");
  if(sw){
    sw.style.background=UI_STATE.activeColor;
    sw.textContent=UI_STATE.activeColor+" ("+UI_STATE.activeLabel+")";
  }
  if(document.getElementById("sharedOverlaySel"))document.getElementById("sharedOverlaySel").value=UI_STATE.overlay;
  if(document.getElementById("sharedThemeSel"))document.getElementById("sharedThemeSel").value=UI_STATE.mode;
  if(document.getElementById("sharedFontSel"))document.getElementById("sharedFontSel").value=UI_STATE.font;
  if(typeof onChromaColorReceived==="function")onChromaColorReceived(UI_STATE.activeColor,UI_STATE.activeLabel);
}

function initSharedCustomizerBar(){
  var popBtn=document.getElementById("openChromaPopupBtn");
  if(popBtn){
    popBtn.onclick=function(){
      var payload=encodeURIComponent(JSON.stringify(UI_STATE));
      writeRootDomainCookie(UI_STATE);
      chromaPopupWin=window.open("https://chroma.forefronthawk.com","HawkChromaCompanion","width=520,height=760");
    };
  }
  window.addEventListener("message",function(e){
    if(!e.data)return;
    if(e.data.type==="FFH_UI_SYNC"&&e.data.ui){
      Object.assign(UI_STATE,e.data.ui);
      saveAndBroadcastUi(false);
    }else if(e.data.hex){
      UI_STATE.activeColor=e.data.hex.toUpperCase();
      UI_STATE.activeLabel=e.data.label||"CHROMA";
      saveAndBroadcastUi(false);
    }
  });
  // Poll .forefronthawk.com root cookie every 800ms so separate tabs on chroma.forefronthawk.com and draw/shine/rgb.forefronthawk.com sync live without needing a popup!
  var lastCookieJson="";
  setInterval(function(){
    var ck=readRootDomainCookie();
    if(ck){
      var j=JSON.stringify(ck);
      if(j!==lastCookieJson){
        lastCookieJson=j;
        Object.assign(UI_STATE,ck);
        applySharedUiToDom();
      }
    }
  },800);
  var ovSel=document.getElementById("sharedOverlaySel");
  if(ovSel&&!ovSel.options.length){
    OVERLAY_LIST.forEach(function(o){
      var op=document.createElement("option");op.value=o[0];op.textContent=o[1];ovSel.appendChild(op);
    });
    ovSel.onchange=function(){UI_STATE.overlay=this.value;saveAndBroadcastUi(true)};
  }
  var thSel=document.getElementById("sharedThemeSel");
  if(thSel){thSel.onchange=function(){UI_STATE.mode=this.value;saveAndBroadcastUi(true)}}
  var fnSel=document.getElementById("sharedFontSel");
  if(fnSel){fnSel.onchange=function(){UI_STATE.font=this.value;saveAndBroadcastUi(true)}}
  var custBtn=document.getElementById("toggleSharedCustBtn");
  if(custBtn){
    custBtn.onclick=function(){
      var p=document.getElementById("sharedCustPanel");
      if(p)p.hidden=!p.hidden;
    };
  }
  ["cBgIn","cPanelIn","cTextIn"].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.oninput=function(){
      UI_STATE.cBg=document.getElementById("cBgIn").value;
      UI_STATE.cPanel=document.getElementById("cPanelIn").value;
      UI_STATE.cText=document.getElementById("cTextIn").value;
      UI_STATE.mode="custom_live";
      saveAndBroadcastUi(true);
    };
  });
}

// Listen for cross-tab / cross-window updates from HawkChroma or any forefronthawk.com app
window.addEventListener("focus",function(){if(typeof loadSharedUi==="function")loadSharedUi()});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&typeof loadSharedUi==="function")loadSharedUi()});
window.addEventListener("storage",function(e){
  if(e.key==="forefronthawk_shared_ui"||e.key==="hawkchroma_v4")loadSharedUi();
});
if(suiteChan){
  suiteChan.onmessage=function(e){
    if(e.data&&e.data.ui){
      Object.assign(UI_STATE,e.data.ui);
      applySharedUiToDom();
    }
  };
}
if(chromaChan){
  chromaChan.onmessage=function(e){
    if(e.data&&e.data.hex){
      UI_STATE.activeColor=e.data.hex.toUpperCase();
      UI_STATE.activeLabel=e.data.label||"CHROMA";
      saveAndBroadcastUi(false);
    }
  };
}

  // 2. Gradient Engine (Builds CSS & CanvasGradient objects)
  function getCssGrad(gObj){
    var s = gObj.s, t = gObj.t, a = gObj.a;
    if(t === "radial") return "radial-gradient(circle, "+s[0]+" 0%, "+s[1]+" 55%, "+s[2]+" 100%)";
    if(t === "stripe") return "repeating-linear-gradient("+a+"deg, "+s[0]+" 0px, "+s[0]+" 14px, "+s[1]+" 14px, "+s[1]+" 28px, "+s[2]+" 28px, "+s[2]+" 42px)";
    return "linear-gradient("+a+"deg, "+s[0]+" 0%, "+s[1]+" 50%, "+s[2]+" 100%)";
  }

  function buildCanvasGradient(x0, y0, x1, y1){
    var s = state.gStops, t = state.gType, a = state.gAngle * Math.PI / 180;
    if(x0 == null){
      var cx = cv.width / 2, cy = cv.height / 2, r = Math.hypot(cv.width, cv.height) / 2;
      x0 = cx - Math.cos(a) * r; y0 = cy - Math.sin(a) * r;
      x1 = cx + Math.cos(a) * r; y1 = cy + Math.sin(a) * r;
    }
    if(t === "radial"){
      var rad = Math.max(20, Math.hypot(x1 - x0, y1 - y0));
      var rg = ctx.createRadialGradient(x0, y0, 2, x0, y0, rad);
      rg.addColorStop(0, s[0]); rg.addColorStop(0.55, s[1]); rg.addColorStop(1, s[2]);
      return rg;
    }
    var lg = ctx.createLinearGradient(x0, y0, x1, y1);
    if(t === "stripe"){
      for(var i=0; i<=10; i++){
        lg.addColorStop(i/10, s[i%3]);
      }
    }else{
      lg.addColorStop(0, s[0]); lg.addColorStop(0.5, s[1]); lg.addColorStop(1, s[2]);
    }
    return lg;
  }

  function getActivePaintStyle(x0, y0, x1, y1){

  }

  function updateGradUi(){

  ["gStop1","gStop2","gStop3","gradTypeSel","gradAngIn"].forEach(function(id){
    document.getElementById(id).addEventListener("input", updateGradUi);
  });
  document.getElementById("useGradToggleBtn").onclick = function(){

  };
  document.getElementById("gradPreviewBox").onclick = function(){

  document.getElementById("saveGradPresetBtn").onclick = function(){

  };

  // 3. Undo / Redo History Engine
  function pushUndo(){
    if(state.undoStack.length >= 20) state.undoStack.shift();
    state.undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
    state.redoStack = [];
  }
  document.getElementById("undoBtn").onclick = function(){
    if(!state.undoStack.length) return;
    state.redoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));

  };
  document.getElementById("redoBtn").onclick = function(){
    if(!state.redoStack.length) return;
    state.undoStack.push(ctx.getImageData(0, 0, cv.width, cv.height));
    ctx.putImageData(state.redoStack.pop(), 0, 0);
  };

  // 4. Canvas Coordinate Mapper (Works accurately at any responsive scale on Desktop, Tablet, and Mobile!)
  function getCanvasCoords(e){
    var rect = cv.getBoundingClientRect();
    var scaleX = cv.width / rect.width;
    var scaleY = cv.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  // 5. Drawing Primitives & Symmetry Engine
  function strokeSegment(x0, y0, x1, y1){
    ctx.save();
    ctx.globalAlpha = state.alpha;
    ctx.lineCap = state.tool === "marker" ? "square" : "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = state.size;
    ctx.strokeStyle = state.tool === "eraser" ? state.bgHex : getActivePaintStyle();
    ctx.fillStyle = ctx.strokeStyle;

    if(state.tool === "spray"){
      var density = Math.max(12, state.size * 2);
      for(var i=0; i<density; i++){
        var ang = Math.random() * Math.PI * 2;
        var rad = Math.random() * state.size * 1.4;
        ctx.fillRect(x1 + Math.cos(ang)*rad, y1 + Math.sin(ang)*rad, 1.5, 1.5);
      }
    }else{
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawWithSymmetry(x0, y0, x1, y1){
    var W = cv.width, H = cv.height;
    strokeSegment(x0, y0, x1, y1);
    if(state.sym === "h" || state.sym === "quad") strokeSegment(W - x0, y0, W - x1, y1);
    if(state.sym === "v" || state.sym === "quad") strokeSegment(x0, H - y0, x1, H - y1);
    if(state.sym === "quad") strokeSegment(W - x0, H - y0, W - x1, H - y1);
    if(state.sym === "mandala"){
      var cx = W / 2, cy = H / 2;
      for(var k=1; k<8; k++){
        var a = k * Math.PI / 4, cos = Math.cos(a), sin = Math.sin(a);
        var rx0 = cx + (x0 - cx)*cos - (y0 - cy)*sin;
        var ry0 = cy + (x0 - cx)*sin + (y0 - cy)*cos;
        var rx1 = cx + (x1 - cx)*cos - (y1 - cy)*sin;
        var ry1 = cy + (x1 - cx)*sin + (y1 - cy)*cos;
        strokeSegment(rx0, ry0, rx1, ry1);
      }
    }
  }

  function drawShapePreview(x0, y0, x1, y1){
    ctx.save();
    ctx.globalAlpha = state.alpha;
    ctx.lineWidth = state.size;
    var style = getActivePaintStyle(x0, y0, x1, y1);
    ctx.strokeStyle = style;
    ctx.fillStyle = style;

    if(state.tool === "grad-drag"){
      ctx.fillStyle = buildCanvasGradient(x0, y0, x1, y1);
      ctx.fillRect(0, 0, cv.width, cv.height);
    }else if(state.tool === "line"){
      ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }else if(state.tool === "rect"){
      if(state.shapeFilled) ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      else ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    }else if(state.tool === "circle"){
      var rx = Math.abs(x1 - x0) / 2, ry = Math.abs(y1 - y0) / 2;
      var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      if(state.shapeFilled) ctx.fill(); else ctx.stroke();
    }else if(state.tool === "star"){
      var rOuter = Math.max(10, Math.hypot(x1 - x0, y1 - y0));
      var rInner = rOuter * 0.42;
      ctx.beginPath();
      for(var i=0; i<10; i++){
        var r = (i % 2 === 0) ? rOuter : rInner;
        var a = (i * Math.PI / 5) - Math.PI / 2;
        var sx = x0 + Math.cos(a) * r, sy = y0 + Math.sin(a) * r;
        if(i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      }
      ctx.closePath();
      if(state.shapeFilled) ctx.fill(); else ctx.stroke();
    }
    ctx.restore();
  }

  // Fast Scanline Flood Fill (Supports both Solid Colors and Gradient Flood Fill!)
  function canvasFloodFill(startX, startY){
    startX = Math.round(startX); startY = Math.round(startY);
    var W = cv.width, H = cv.height;
    if(startX < 0 || startX >= W || startY < 0 || startY >= H) return;

    if(state.useGrad){
      // If Paint w/ Gradient is active, fill the canvas/region with the active gradient
      ctx.save();
      ctx.globalAlpha = state.alpha;
      ctx.fillStyle = buildCanvasGradient();
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      return;
    }

    var img = ctx.getImageData(0, 0, W, H), d = img.data;
    var startPos = (startY * W + startX) * 4;
    var sr = d[startPos], sg = d[startPos+1], sb = d[startPos+2], sa = d[startPos+3];

    var fillHex = document.getElementById("primaryColorIn").value || state.color;
    var num = parseInt(fillHex.slice(1), 16);
    var fr = (num >> 16) & 255, fg = (num >> 8) & 255, fb = num & 255;
    if(Math.abs(sr - fr) < 3 && Math.abs(sg - fg) < 3 && Math.abs(sb - fb) < 3 && sa > 250) return;

    var stack = [[startX, startY]], seen = new Uint8Array(W * H);
    while(stack.length){
      var pt = stack.pop(), x = pt[0], y = pt[1];
      var idx = y * W + x;
      if(x < 0 || x >= W || y < 0 || y >= H || seen[idx]) continue;
      var p = idx * 4;
      if(Math.abs(d[p]-sr) > 22 || Math.abs(d[p+1]-sg) > 22 || Math.abs(d[p+2]-sb) > 22) continue;
      seen[idx] = 1;
      d[p] = fr; d[p+1] = fg; d[p+2] = fb; d[p+3] = 255;
      stack.push([x+1, y], [x-1, y], [x, y+1], [x, y-1]);
    }
    ctx.putImageData(img, 0, 0);
  }

  // 6. Pointer Event Listeners on Paint Canvas (Works identically for Desktop Mouse, Tablet Stylus, and Mobile Touch!)
  cv.addEventListener("pointerdown", function(e){
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch(err){}
    var pt = getCanvasCoords(e);

    if(state.tool === "picker"){
      var px = ctx.getImageData(Math.round(pt.x), Math.round(pt.y), 1, 1).data;
      var picked = "#" + [px[0], px[1], px[2]].map(function(v){ return v.toString(16).padStart(2, "0"); }).join("").toUpperCase();
      state.color = picked;
      document.getElementById("primaryColorIn").value = picked;
      UI_STATE.activeColor = picked;
      saveAndBroadcastUi(true);
      return;
    }

    pushUndo();

    if(state.tool === "bucket"){
      canvasFloodFill(pt.x, pt.y);
      return;
    }

    if(state.tool === "text"){
      var txt = document.getElementById("textStampIn").value || "ForefrontHawk";
      ctx.save();
      ctx.globalAlpha = state.alpha;
      ctx.font = "800 " + Math.max(18, state.size * 3.2) + "px " + (FONTS[UI_STATE.font] || "sans-serif");
      ctx.fillStyle = getActivePaintStyle(pt.x - 100, pt.y - 30, pt.x + 100, pt.y + 30);
      ctx.fillText(txt, pt.x, pt.y);
      ctx.restore();
      return;
    }

    state.drawing = true;
    state.startX = state.lastX = pt.x;
    state.startY = state.lastY = pt.y;
    state.snapshot = ctx.getImageData(0, 0, cv.width, cv.height);

    if(state.tool === "brush" || state.tool === "marker" || state.tool === "spray" || state.tool === "eraser"){
      drawWithSymmetry(pt.x, pt.y, pt.x + 0.1, pt.y + 0.1);
    }
  });

  cv.addEventListener("pointermove", function(e){
    if(!state.drawing) return;
    var pt = getCanvasCoords(e);
    if(state.tool === "brush" || state.tool === "marker" || state.tool === "spray" || state.tool === "eraser"){
      drawWithSymmetry(state.lastX, state.lastY, pt.x, pt.y);
      state.lastX = pt.x;
      state.lastY = pt.y;
    }else{
      ctx.putImageData(state.snapshot, 0, 0);
      drawShapePreview(state.startX, state.startY, pt.x, pt.y);
    }
  });

  function endStroke(e){
    if(!state.drawing) return;
    state.drawing = false;
  }
  cv.addEventListener("pointerup", endStroke);
  cv.addEventListener("pointercancel", endStroke);

  // 7. Light-Rite Pegboard Mode (Now with direct Desktop Mouse & Mobile Touch listeners on each peg!)
  function buildPegBoard(){
    board.innerHTML = ""; state.pegs = [];
    board.style.setProperty("--pcols", state.pCols);
    for(var r=0; r<state.pRows; r++){
      for(var c=0; c<state.pCols; c++){
        var p = document.createElement("div");
        p.className = "peg";
        p.dataset.r = r; p.dataset.c = c; p.dataset.color = "";
        (function(row, col, el){
          el.addEventListener("pointerdown", function(ev){
            ev.preventDefault();
            state.pegDown = true;
            paintPegCell(row, col);
          });
          el.addEventListener("pointerenter", function(){
            if(state.pegDown) paintPegCell(row, col);
          });
        })(r, c, p);
        board.appendChild(p);
        state.pegs.push(p);
      }
    }
  }
  window.addEventListener("pointerup", function(){ state.pegDown = false; });

  function setSinglePeg(r, c, hx){
    if(r < 0 || r >= state.pRows || c < 0 || c >= state.pCols) return;
    var p = state.pegs[r * state.pCols + c]; if(!p) return;
    if(hx){
      p.classList.add("lit"); p.style.setProperty("--pc", hx); p.dataset.color = hx;
    }else{
      p.classList.remove("lit"); p.style.removeProperty("--pc"); p.dataset.color = "";
    }
  }

  function paintPegCell(r, c){
    var hx = state.tool === "eraser" ? "" : (document.getElementById("primaryColorIn").value || state.color);
    if(state.useGrad && hx){
      hx = state.gStops[(r + c) % 3];
    }
    setSinglePeg(r, c, hx);
    if(state.sym === "h" || state.sym === "quad") setSinglePeg(r, state.pCols - 1 - c, hx);
    if(state.sym === "v" || state.sym === "quad") setSinglePeg(state.pRows - 1 - r, c, hx);
    if(state.sym === "quad") setSinglePeg(state.pRows - 1 - r, state.pCols - 1 - c, hx);
  }

  function loadHawkPegSample(){
    buildPegBoard();
    var mc = Math.floor(state.pCols / 2), mr = Math.floor(state.pRows / 2);
    for(var w=0; w<Math.min(11, mc-1); w++){
      setSinglePeg(mr - Math.floor(w/2), mc + w, "#D4AF37");
      setSinglePeg(mr - Math.floor(w/2), mc - 1 - w, "#D4AF37");
      setSinglePeg(mr - Math.floor(w/2) + 1, mc + w, "#38BDF8");
      setSinglePeg(mr - Math.floor(w/2) + 1, mc - 1 - w, "#38BDF8");
      setSinglePeg(mr + Math.floor(w/3), mc + Math.floor(w/2), "#10B981");
      setSinglePeg(mr + Math.floor(w/3), mc - 1 - Math.floor(w/2), "#10B981");
    }
  }

  // Stamp Light-Rite Pegs onto the High-Res Studio Paint Canvas!
  document.getElementById("stampPegsToPaintBtn").onclick = function(){
    pushUndo();
    ctx.fillStyle = "#05070C";
    ctx.fillRect(0, 0, cv.width, cv.height);
    var cellW = cv.width / state.pCols, cellH = cv.height / state.pRows;
    var rad = Math.min(cellW, cellH) * 0.36;
    for(var r=0; r<state.pRows; r++){
      for(var c=0; c<state.pCols; c++){
        var col = state.pegs[r * state.pCols + c].dataset.color;
        var cx = (c + 0.5) * cellW, cy = (r + 0.5) * cellH;
        ctx.save();
        ctx.beginPath(); ctx.arc(cx, cy, col ? rad : rad * 0.35, 0, Math.PI * 2);
        ctx.fillStyle = col || "#161B26";
        if(col){ ctx.shadowColor = col; ctx.shadowBlur = 16; }
        ctx.fill();
        ctx.restore();
      }
    }
    switchCanvasMode("paint");
  };
  document.getElementById("pegSampleHawkBtn").onclick = loadHawkPegSample;
  document.getElementById("pegClearBtn").onclick = buildPegBoard;
  document.getElementById("pegExportPngBtn").onclick = function(){
    document.getElementById("stampPegsToPaintBtn").click();
    document.getElementById("exportPaintPngBtn").click();
  };
  document.getElementById("pegShapeSel").onchange = function(){
    board.style.setProperty("--prad", this.value);
  };
  var pegPulsing = false;
  document.getElementById("pegPulseBtn").onclick = function(){
    pegPulsing = !pegPulsing;
    this.textContent = pegPulsing ? "✨ Glow Pulse: ON" : "✨ Glow Pulse: Off";
  };
  document.querySelectorAll("#drawToolSeg button").forEach(function(b){
    b.onclick = function(){
      state.tool = b.dataset.t === "erase" ? "eraser" : b.dataset.t;
      document.querySelectorAll("#drawToolSeg button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); });
    };
  });
  document.getElementById("pegGridSel").onchange = function(){
    var pts = this.value.split("x"); state.pCols = +pts[0]; state.pRows = +pts[1];
    loadHawkPegSample();
  };

  // 8. Mode Switching (Studio Paint Canvas vs Light-Rite Peg Mode)
  function switchCanvasMode(m){
    state.canvasMode = m;
    var isPaint = (m === "paint");
    cv.hidden = !isPaint;
    board.hidden = isPaint;
    document.getElementById("paintToolsGroup").hidden = !isPaint;

  });

  document.querySelectorAll("#paintToolsGroup button").forEach(function(b){
    b.onclick = function(){
      state.tool = b.dataset.tool;
      document.querySelectorAll("#paintToolsGroup button").forEach(function(x){

    fillCanvasBackground(getActivePaintStyle(), document.getElementById("primaryColorIn").value);
  };
  document.getElementById("darkCanvasBtn").onclick = function(){ fillCanvasBackground("#0B0E17", "#0B0E17"); };
  document.getElementById("whiteCanvasBtn").onclick = function(){ fillCanvasBackground("#FFFFFF", "#FFFFFF"); };

  // Full Screen Paint Mode (With Room for the Toolbar!)
  var isFs = false;
  function toggleFsPaint(){
    isFs = !isFs;
    document.body.classList.toggle("fs-paint", isFs);
    document.getElementById("exitFsInlineBtn").hidden = !isFs;
    document.getElementById("fsPaintBtn").textContent = isFs ? "✕ Exit FS" : "⛶ Full Screen";
    var docEl = document.documentElement;
    if(isFs){
      try {
        var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
        if(req) req.call(docEl).catch(function(){});
      } catch(e){}
    }else{
      try {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        if((document.fullscreenElement || document.webkitFullscreenElement) && ex) ex.call(document);
      } catch(e){}
    }
  }
  document.getElementById("fsPaintBtn").onclick = toggleFsPaint;
  document.getElementById("exitFsInlineBtn").onclick = toggleFsPaint;

  document.getElementById("exportPaintPngBtn").onclick = function(){
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = "hawkdraw_studio_artwork.png";
    a.click();
  };

  window.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
      e.preventDefault(); document.getElementById("undoBtn").click();
    }else if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y"){
      e.preventDefault(); document.getElementById("redoBtn").click();
    }
  });

  // Draw initial welcome gradient artwork on the Studio Paint Canvas so the user sees it working right away!
  function initStarterArtwork(){
    ctx.fillStyle = "#0B0E17";
    ctx.fillRect(0, 0, cv.width, cv.height);
    // Subtle glowing horizon gradient banner
    var g = ctx.createLinearGradient(180, 120, 1100, 600);
    g.addColorStop(0, "#D4AF37"); g.addColorStop(0.5, "#10B981"); g.addColorStop(1, "#38BDF8");
    ctx.strokeStyle = g; ctx.lineWidth = 6;
    ctx.strokeRect(80, 70, cv.width - 160, cv.height - 140);
    ctx.fillStyle = g;
    ctx.font = "800 42px Inter, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("🦅 HAWKDRAW STUDIO PAINT & GRADIENT LAB", cv.width / 2, cv.height / 2 - 12);
    ctx.font = "600 20px Inter, system-ui, sans-serif";
    ctx.fillStyle = "#94A3B8";
    ctx.fillText("Click & drag anywhere to paint • Toggle '🌈 Paint w/ Gradient' or '💡 Light-Rite Mode' above", cv.width / 2, cv.height / 2 + 32);
    ctx.textAlign = "start";
  }

  initSharedCustomizerBar();
  updateGradUi();
  renderGradPresets();
  initStarterArtwork();
  loadHawkPegSample();
  loadSharedUi();
})();
</script>
</body>
</html>
